services:
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    hostname: mqtt
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    ports:
      - "1883:1883"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - mosquitto_config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mosquitto_config:
  mosquitto_data:
  mosquitto_log:
